# One-command demo, two services sharing an evidence volume:
#   xetra-cycle  — runs a HUNT->HARDEN->RESPOND->RECOVER->ATTEST cycle
#                  every 5 minutes against mock adapters by default.
#   xetra-web    — serves the dashboard at http://localhost:8420,
#                  auto-loading whatever xetra-cycle produces.
#
# Edit ../config/config.yaml and pass real credentials via environment
# to go live on any stratum (see docs/GOING_LIVE.md).
version: "3.9"
services:
  xetra-cycle:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../config:/app/config
      - xetra-evidence:/app/evidence_output
    environment:
      - PYTHONUNBUFFERED=1
      # Uncomment and fill to go live on a stratum (see docs/GOING_LIVE.md):
      # - ATTACKIQ_BASE_URL=
      # - ATTACKIQ_API_TOKEN=
      # - SPLUNK_BASE_URL=
      # - SPLUNK_TOKEN=
      # - FALCON_CLIENT_ID=
      # - FALCON_CLIENT_SECRET=
      # - ANTHROPIC_API_KEY=
    command: >
      sh -c "while true; do
        python -m xetra.cli run --config config/config.yaml --label scheduled;
        sleep 300;
      done"

  xetra-web:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - xetra-cycle
    ports:
      - "8420:8420"
    volumes:
      - ../config:/app/config
      - xetra-evidence:/app/evidence_output
    environment:
      - PYTHONUNBUFFERED=1
    entrypoint: ["python", "-m", "xetra.cli"]
    command: ["serve", "--port", "8420", "--evidence-dir", "evidence_output", "--config", "config/config.yaml"]

volumes:
  xetra-evidence:
