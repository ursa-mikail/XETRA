# One-command demo:  ./up   →  http://localhost:8420
#
# One container does both jobs the old two-container setup did:
#   * runs a full HUNT→HARDEN→RESPOND→RECOVER→ATTEST cycle immediately, then every 5 minutes
#     (XETRA_SCHEDULE_MINUTES) — against simulated data until you connect real tools
#   * serves the dashboard, which updates live
# Unlike the old loop, the schedule is visible in the dashboard and can be paused, changed or
# switched off there. A change made in the dashboard wins over the variable below.
#
# Go live: enter credentials in the dashboard (Setup), or uncomment variables below
# (variables set here always win over the dashboard).
# Published on 127.0.0.1 only. To expose it, put your own authenticating proxy in front
# and set XETRA_ALLOWED_HOSTS.
services:
  xetra:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8420:8420"
    environment:
      - PYTHONUNBUFFERED=1
      - XETRA_SCHEDULE_MINUTES=5
      # - ATTACKIQ_BASE_URL=
      # - ATTACKIQ_API_TOKEN=
      # - SPLUNK_BASE_URL=
      # - SPLUNK_TOKEN=
      # - FALCON_CLIENT_ID=
      # - FALCON_CLIENT_SECRET=
      # - ANTHROPIC_API_KEY=
    volumes:
      - ../config:/app/config
      - xetra-state:/app/.xetra
      - xetra-evidence:/app/evidence_output
    restart: unless-stopped

volumes:
  xetra-state:
  xetra-evidence:
