[project]
name = "xetra"
version = "0.1.0"
description = "XETRA — the structural inverse of ARTEX. Continuous, evidence-generating control validation across 7 strata."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.scripts]
xetra = "xetra.cli:main"

[tool.setuptools.packages.find]
include = ["xetra*"]

[tool.setuptools.package-data]
xetra = ["ttp_library/*.yaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
