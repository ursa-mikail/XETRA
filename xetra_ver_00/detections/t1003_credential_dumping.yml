title: LSASS Memory Access by Non-Standard Process
id: 8d26e884-1f70-4a95-9c9c-xetra0002
status: stable
description: Detects process handle requests to lsass.exe with access rights consistent with credential dumping (e.g. Mimikatz-style access).
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: XETRA Project
date: 2026/11/20
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    filter:
        SourceImage|endswith:
            - '\wmiprvse.exe'
            - '\MsMpEng.exe'
    condition: selection and not filter
falsepositives:
    - EDR/AV agents with legitimate LSASS access (tune the filter list per environment)
level: critical
tags:
    - attack.credential_access
    - attack.t1003.001
