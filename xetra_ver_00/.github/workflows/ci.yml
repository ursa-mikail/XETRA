name: XETRA CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run test suite (mock adapters — no credentials required)
        run: pytest tests/ -v --cov=xetra
      - name: Smoke-test CLI end to end
        run: |
          export XETRA_MOCK_DELAY_MS=0
          python -m xetra.cli doctor --config config/config.yaml
          python -m xetra.cli run --config config/config.yaml --strata service,hardware
          python -m xetra.cli status --config config/config.yaml | grep -q "never"
      - name: Smoke-test dashboard server
        run: |
          export XETRA_MOCK_DELAY_MS=0
          python -m xetra.cli serve --port 8420 --config config/config.yaml &
          sleep 2
          curl -sf http://localhost:8420/healthz
          curl -sf http://localhost:8420/ | grep -qi "<html"
          curl -sf http://localhost:8420/api/overview | grep -q '"strata"'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8420/api/run
          sleep 3
          curl -sf http://localhost:8420/api/overview | grep -q '"tested"'
