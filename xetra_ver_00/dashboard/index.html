<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XETRA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f2a3d'/%3E%3Crect x='5' y='6' width='22' height='3.5' fill='%23e8eef2'/%3E%3Crect x='5' y='11.5' width='22' height='3.5' fill='%2349b8a8'/%3E%3Crect x='5' y='17' width='22' height='3.5' fill='%23e8eef2'/%3E%3Crect x='5' y='22.5' width='14' height='3.5' fill='%23e5533d'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#eef1f3; --surface:#ffffff; --sunk:#e4e9ec; --line:#d3dade; --line-soft:#e3e8eb;
  --ink:#0f2a3d; --ink-2:#4a6071; --ink-3:#7a8d9b;
  --caught:#1f9d8c; --caught-bg:#dff3ef;
  --gap:#d9432b;   --gap-bg:#fbe5e0;
  --unk:#c98a12;   --unk-bg:#faefd3;
  --none:#9fb0bb;
  --brand:#0f2a3d; --brand-ink:#e8eef2; --focus:#2a6fdb;
  --sim:#b7570a; --sim-bg:#fdecd6;
  --radius:10px; --radius-sm:6px;
  --font:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --paper:#0b1822; --surface:#122533; --sunk:#0d1d29; --line:#243a4b; --line-soft:#1b3040;
  --ink:#e6eef3; --ink-2:#a3b6c3; --ink-3:#70879a;
  --caught:#3cc3b0; --caught-bg:#12363a; --gap:#ff6a50; --gap-bg:#3d1f1f; --unk:#e4a83a; --unk-bg:#3a2e14;
  --none:#4d6678; --brand:#06111a; --brand-ink:#e6eef3; --focus:#6aa2ff; --sim:#f0a050; --sim-bg:#3a2a14;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
h2{font-size:16px;font-weight:650}
h3{font-size:13px;font-weight:650}
p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;height:100vh}
.bar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:15px}
.brand svg{display:block}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.sim{background:var(--sim-bg);color:var(--sim)}
.pill.live{background:var(--caught-bg);color:var(--caught)}
.bar .pill.sim{background:#3d2a12;color:#ffc27a} .bar .pill.live{background:#10403b;color:#7fe3d3}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.dot.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.bar .state{display:flex;flex-direction:column;line-height:1.25;min-width:190px}
.bar .state b{font-size:13px;font-weight:650} .bar .state span{font-size:12px;opacity:.72}
.bar .spacer{flex:1}
.bar .progress{flex:1;min-width:150px;max-width:340px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--caught);border-color:var(--caught);color:#fff}
:root[data-theme=dark] .btn.primary{color:#06111a}
.btn.danger{background:var(--gap);border-color:var(--gap);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:12px}
.bar .btn{background:transparent;border-color:#3a566b;color:var(--brand-ink)}
.bar .btn.primary{background:var(--caught);border-color:var(--caught);color:#fff}
.bar .btn.danger{background:var(--gap);border-color:var(--gap)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:10px;width:290px;box-shadow:0 12px 32px rgba(8,22,32,.25);z-index:30}
.menu-pop label{display:flex;gap:9px;align-items:center;padding:5px 4px;cursor:pointer;border-radius:5px}
.menu-pop label:hover{background:var(--sunk)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:8px 0}

.rail{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.rail .grp{font-size:12px;color:var(--ink-3);padding:12px 10px 5px;font-weight:600}
.rail button.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:550}
.rail button.nav:hover{background:var(--sunk)}
.rail button.nav[aria-current=page]{background:var(--ink);color:var(--paper)}
:root[data-theme=dark] .rail button.nav[aria-current=page]{background:#e6eef3;color:#0b1822}
.rail .n{font-family:var(--mono);font-size:11px;opacity:.6;width:12px}
.rail .tag{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.tag.gap{background:var(--gap-bg);color:var(--gap)} .tag.ok{background:var(--caught-bg);color:var(--caught)} .tag.unk{background:var(--unk-bg);color:var(--unk)} .tag.none{background:var(--sunk);color:var(--ink-3)}
.rail .sdot{width:9px;height:9px;border-radius:2px;flex:none}
.sdot.healthy{background:var(--caught)} .sdot.gaps{background:var(--gap)} .sdot.not_tested{background:var(--unk)} .sdot.partial{background:repeating-linear-gradient(45deg,var(--caught) 0 2px,var(--sunk) 2px 4px)} .sdot.never_run{background:transparent;border:1.5px dashed var(--none)}
.rail .foot{margin-top:18px;padding:10px;font-size:12px;color:var(--ink-3)}

main{overflow:auto;padding:26px 34px 60px}
.wrap{max-width:1060px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{margin-top:5px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card + .card{margin-top:14px}
.grid > .card{margin-top:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.rail{display:none}main{padding:18px}}

/* ---------- next action ---------- */
.next{display:flex;gap:18px;align-items:center;justify-content:space-between;border-left:5px solid var(--caught);flex-wrap:wrap}
.next.warn{border-left-color:var(--gap)} .next.info{border-left-color:var(--focus)}
.next h2{font-size:18px}

/* ---------- stat ---------- */
.stat b{display:block;font-size:30px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}
.stat.gap b{color:var(--gap)} .stat.ok b{color:var(--caught)} .stat.unk b{color:var(--unk)}

/* ---------- THE strata column: every technique is one cell ---------- */
.strata-col{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.band{display:grid;grid-template-columns:190px 1fr 210px;gap:14px;align-items:center;padding:13px 16px;border:0;background:none;text-align:left;cursor:pointer;width:100%;border-top:1px solid var(--line-soft)}
.band:first-child{border-top:0}
.band:hover{background:var(--sunk)}
.band .nm{display:flex;gap:9px;align-items:baseline}
.band .nm .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.band .nm b{font-weight:650}
.band .cnt{text-align:right;font-size:12.5px;color:var(--ink-2)}
.band .cnt b{color:var(--ink);font-variant-numeric:tabular-nums}
.cells{display:flex;flex-wrap:wrap;gap:2px}
.cell{width:9px;height:18px;border-radius:2px;background:var(--none);opacity:.28;flex:none}
.cell.caught{background:var(--caught);opacity:1}
.cell.gap{background:repeating-linear-gradient(135deg,var(--gap) 0 2px,#f19a8b 2px 4px);opacity:1}
.cell.not_tested{background:radial-gradient(circle,var(--unk) 1.6px,transparent 1.8px) 0 0/5px 5px,var(--unk-bg);opacity:1;outline:1px solid var(--unk);outline-offset:-1px}
.cell.untested{background:transparent;border:1.5px dashed var(--none);opacity:.8}
.cell.running{animation:pulse .6s ease-in-out infinite;background:var(--focus);opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:11px;height:16px;border-radius:2px;vertical-align:-3px;margin-right:6px}

/* ---------- stage stepper ---------- */
.stages{display:flex;gap:0;margin:2px 0 14px}
.stage{flex:1;padding:8px 10px;border-top:3px solid var(--line);font-size:12.5px;color:var(--ink-3);font-weight:600}
.stage.running{border-color:var(--focus);color:var(--ink)} .stage.done{border-color:var(--caught);color:var(--ink-2)}
.stage small{display:block;font-weight:500;color:var(--ink-3)}
.meter{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--caught);transition:width .3s}
.bar .meter{background:#27475c}
.log{background:var(--sunk);border-radius:var(--radius-sm);padding:10px 12px;max-height:190px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.7}
.log div span{color:var(--ink-3);margin-right:9px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.caught{background:var(--caught-bg);color:var(--caught)} .badge.gap{background:var(--gap-bg);color:var(--gap)}
.badge.not_tested{background:var(--unk-bg);color:var(--unk)} .badge.untested,.badge.never_run{background:var(--sunk);color:var(--ink-3)}
.badge.open{background:var(--gap-bg);color:var(--gap)} .badge.approved{background:var(--unk-bg);color:var(--unk)}
.badge.verified{background:var(--caught-bg);color:var(--caught)} .badge.risk_accepted{background:var(--sunk);color:var(--ink-2)}
.badge.simulated{background:var(--sim-bg);color:var(--sim)} .badge.verified-c{background:var(--caught-bg);color:var(--caught)}
.badge.failed,.badge.rejected{background:var(--gap-bg);color:var(--gap)} .badge.untested-c{background:var(--unk-bg);color:var(--unk)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 13px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}

/* ---------- forms / setup ---------- */
.step{display:grid;grid-template-columns:34px 1fr;gap:14px}
.step + .step{margin-top:14px}
.step .no{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:14px}
.step .no.done{background:var(--caught);color:#fff}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:12px 0}
.choice{border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--ink-3)}
.choice[aria-checked=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice b{display:block;font-size:13px}.choice span{font-size:12px;color:var(--ink-2)}
.field{margin:10px 0}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.field .help{font-size:12px;color:var(--ink-3);margin-top:3px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
input:focus,select:focus,textarea:focus{border-color:var(--focus)}
.input-row{display:flex;gap:8px}
.result{margin-top:12px;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:13px}
.result.ok{background:var(--caught-bg);border-color:var(--caught)} .result.bad{background:var(--gap-bg);border-color:var(--gap)} .result.warn{background:var(--unk-bg);border-color:var(--unk)}
.result b{display:block;margin-bottom:2px}
.switch{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.switch:last-child{border-bottom:0}
.switch .t{flex:1}.switch .t p{color:var(--ink-2);font-size:13px;margin-top:2px;max-width:60ch}
.tog{width:44px;height:25px;border-radius:99px;background:var(--none);border:0;position:relative;cursor:pointer;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-checked=true]{background:var(--caught)} .tog[aria-checked=true]::after{transform:translateX(19px)}
.tog.risky[aria-checked=true]{background:var(--gap)}
.callout{padding:12px 15px;border-radius:var(--radius-sm);background:var(--sim-bg);color:var(--ink);border:1px solid var(--sim);font-size:13px}
.callout b{color:var(--sim)}
.callout.calm{background:var(--sunk);border-color:var(--line)}.callout.calm b{color:var(--ink)}
.empty{text-align:center;padding:38px 20px;color:var(--ink-2)}
.empty h3{font-size:15px;margin-bottom:6px;color:var(--ink)}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,22,32,.5);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);background:var(--surface);height:100%;overflow:auto;padding:22px 24px;box-shadow:-12px 0 40px rgba(0,0,0,.3)}
.modal{margin:auto;background:var(--surface);border-radius:var(--radius);padding:22px 24px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.scrim.center{justify-content:center;align-items:center}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px;margin:12px 0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;word-break:break-word}
pre.json{background:var(--sunk);padding:12px;border-radius:var(--radius-sm);overflow:auto;font-size:11.5px;max-height:260px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:90vw}
.toast.err{background:var(--gap);color:#fff}
.spark{display:block}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.banner{border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
.banner.stale{background:var(--gap-bg);border:1.5px solid var(--gap);color:var(--gap)}
.banner small{display:block;font-weight:400;color:var(--ink);opacity:.85}
.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--ink-2);cursor:pointer}
.dropzone.over{border-color:var(--focus);background:var(--sunk)}
.stalemark{color:var(--gap);font-weight:650}
</style>
</head>
<body>
<div class="app">
  <header class="bar" id="bar" role="banner"></header>
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="layer"></div>

<script>
"use strict";
/* =========================================================================
   XETRA dashboard — plain JS, no libraries, works offline.
   State flows one way: server → `S` → render(). Nothing is cached client-
   side except the theme and your name for sign-offs.
   ========================================================================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = {ov:null, route:"overview", catalog:null, cfg:null, stratum:{}, fixes:[], runs:[], events:[], doctor:null,
           draft:{}, tests:{}, poll:null, fixFilter:{status:"open",stratum:""}, evFilter:"", runMenuOpen:false, runPick:new Set(), evTab:"runs"};
const store = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

async function api(path, body){
  const opt = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)};
  let r;
  try { r = await fetch(path, opt); }
  catch(e){ throw new Error("Can't reach XETRA. Is it still running? (start it again with: xetra start)"); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const err = new Error(j.error || `Request failed (${r.status})`); err.fix = j.fix; throw err; }
  return j;
}
function toast(msg, err){ const t=document.createElement("div"); t.className="toast"+(err?" err":""); t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?6000:2800); }
const guard = fn => async (...a) => { try { return await fn(...a); } catch(e){ toast(e.message + (e.fix ? " — "+e.fix : ""), true); } };

function ago(iso){ if(!iso) return "never"; const m=(Date.now()-new Date(iso))/60000; if(m<1) return "just now"; if(m<60) return Math.round(m)+" min ago"; if(m<1440) return (m/60).toFixed(1)+" h ago"; return Math.round(m/1440)+" d ago"; }
function until(iso){ if(!iso) return ""; const m=(new Date(iso)-Date.now())/60000; return m<=0?"any moment":m<60?"in "+Math.ceil(m)+" min":"in "+(m/60).toFixed(1)+" h"; }
const STATUS_LABEL = {caught:"Caught", gap:"Missed", not_tested:"Couldn't test", untested:"Not run yet", healthy:"All caught", gaps:"Gaps", partial:"Partly tested", never_run:"Not run yet"};

/* ------------------------------------------------------------ data loading */
async function refresh(){
  S.ov = await api("/api/overview");
  const job = S.ov.job;
  if(job && (job.state==="running"||job.state==="stopping")) startPolling(); 
  render();
}
async function loadRoute(){
  if(S.route.startsWith("s:")){ const id=S.route.slice(2); S.stratum[id] = await api("/api/stratum/"+id); }
  if(S.route==="setup"){ S.catalog = S.catalog || await api("/api/catalog"); S.cfg = await api("/api/config"); S.doctor = (await api("/api/doctor")).checks; }
  if(S.route==="controls"){ S.cfg = await api("/api/config"); }
  if(S.route==="findings"){ S.findings = (await api("/api/findings")).findings; }
  if(S.route==="fixes"){ S.fixes = (await api("/api/fixes")).fixes; }
  if(S.route==="activity"){ S.events = (await api("/api/events?limit=300")).events; S.runs = (await api("/api/runs")).runs; }
}
function startPolling(){
  if(S.poll) return;
  S.poll = setInterval(async()=>{
    try{
      const r = await api("/api/run"); const prev = S.ov.job; S.ov.job = r.job;
      const finished = r.job && !["running","stopping"].includes(r.job.state);
      if(finished){ clearInterval(S.poll); S.poll=null; await refresh(); await loadRoute(); render();
        toast(r.job.state==="completed"?"Run complete — results saved.":r.job.state==="cancelled"?"Run stopped. Nothing from it was saved.":"Run failed: "+r.job.error, r.job.state==="failed"); }
      else { renderBar(); if(S.route==="overview") renderLive(); }
    }catch(e){}
  }, 900);
}
async function go(route){
  S.route = route; location.hash = route; await guard(async()=>{ await loadRoute(); })(); render();
  $("#main").scrollTop = 0;
}

/* ------------------------------------------------------------------ bar */
function renderBar(){
  const o = S.ov; if(!o) return;
  const job = o.job, running = job && ["running","stopping"].includes(job.state);
  const mode = o.mode==="live" ? `<span class="pill live"><span class="dot"></span>Live tools</span>`

function staleBanner(){

  const why = st.scheduler_overdue ? `The schedule is on (every ${S.ov.schedule.every_minutes} min) but no run has finished for ${txt}. The scheduler may have stopped — check the Activity log.` : `The last run finished ${txt} ago. Results older than ${st.threshold_minutes<120?st.threshold_minutes+" minutes":Math.round(st.threshold_minutes/60*10)/10+" hours"} are treated as stale.`;

function trendChart(){
  const t=S.ov.trend||[]; if(t.length<2) return `<p class="muted" style="font-size:13px">The trend appears after your second run.</p>`;
  const W=640,H=130,P=26,mx=Math.max(...t.map(x=>x.gaps),1);
  const X=i=>P+i*(W-2*P)/(t.length-1), Y=v=>H-P-(v/mx)*(H-2*P);
  const pts=t.map((x,i)=>`${X(i).toFixed(1)},${Y(x.gaps).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Missed techniques after each of the last ${t.length} runs, now ${t[t.length-1].gaps}">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)"/><polyline fill="none" stroke="var(--gap)" stroke-width="2.5" points="${pts}"/>
    ${t.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.gaps)}" r="3.5" fill="var(--gap)"><title>${new Date(x.ts).toLocaleString()}: ${x.gaps} missed of ${x.tested} tested</title></circle>`).join("")}
    <text x="${P}" y="14" font-size="11" fill="var(--ink-3)">${mx} missed</text><text x="${P}" y="${H-8}" font-size="11" fill="var(--ink-3)">0</text>

}

function sparkline(vals){ if(vals.length<2) return ""; const w=120,h=30,mx=Math.max(...vals,1); const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-(v/mx)*(h-6)).toFixed(1)}`).join(" ");

  return `<div class="wrap"><div class="page-head"><div><h1>Setup</h1>
    <p class="muted">Connect XETRA to your real tools one at a time. Everything works in simulated mode first, so there's nothing to break. After each step, press <b>Test connection</b> — you'll get a plain answer and what to do next.</p></div>
    <span class="pill ${liveCount===4?"live":"sim"}">${liveCount} of 4 core tools live</span></div>
    <div class="step"><div class="no ${scope.authorized_by?"done":""}">${scope.authorized_by?"✓":"1"}</div><div class="card"><h2>Who authorised testing?</h2>
      <p class="muted" style="margin:4px 0 8px">Only needed before you connect a real attack-emulation tool. Record whoever signed your Rules of Engagement — it's stamped into the evidence.</p>
      <div class="grid g2"><div class="field"><label for="sc-by">Authorised by (name and role)</label><input type="text" id="sc-by" value="${esc(scope.authorized_by)}" placeholder="e.g. Dana Lee, CISO"></div>
        <div class="field"><label for="sc-env">Environment</label><select id="sc-env"><option value="staging" ${scope.environment==="staging"?"selected":""}>Staging (recommended)</option><option value="production" ${scope.environment==="production"?"selected":""}>Production</option></select></div></div>
      <div class="field"><label for="sc-t">Authorised targets <span class="faint" style="font-weight:400">(optional — comma separated)</span></label><input type="text" id="sc-t" value="${esc((scope.targets||[]).join(", "))}" placeholder="10.0.0.0/24, app.staging.example.com"><div class="help">Leave blank if your scope lives entirely inside the attack-emulation tool's console.</div></div>
      <button class="btn" id="save-scope">Save</button></div></div>
    ${cats.map((k,i)=>setupCard(k,i+2)).join("")}
    <div class="card" style="margin-top:18px"><h2>Pre-flight check</h2><p class="muted" style="margin:3px 0 10px">The same checks as <span class="mono">xetra doctor</span>.</p>
      ${(S.doctor||[]).map(c=>`<div class="row" style="padding:7px 0;border-top:1px solid var(--line-soft);align-items:flex-start"><span class="badge ${c.status==="PASS"?"caught":c.status==="WARN"?"not_tested":"gap"}" style="min-width:52px;justify-content:center">${c.status}</span>
        <div style="flex:1"><b>${esc(c.name)}</b> <span class="muted">${esc(c.message)}</span>${c.fix?`<div class="faint" style="font-size:12.5px">→ ${esc(c.fix)}</div>`:""}</div></div>`).join("")}</div></div>`;
}
function setupCard(cat, no){
  const meta=S.catalog.categories[cat], cfg=S.cfg.categories[cat], d=S.draft[cat]||(S.draft[cat]={provider:cfg.provider, values:{}, model:cfg.model||""});
  const prov=S.catalog.providers[cat][d.provider]; const st=connState(cat);
  const fields = d.provider===cfg.provider ? cfg.fields : prov.fields.map(f=>({env:f.env,label:f.label,kind:f.kind,help:f.help,placeholder:f.placeholder,set:false,value:f.default||"",masked:""}));
  const t=S.tests[cat];
  const dirty = d.provider!==cfg.provider || Object.values(d.values).some(v=>v) || (cat==="llm"&&d.model!==(cfg.model||""));
  return `<div class="step"><div class="no ${st.cls.startsWith("verified")||st.cls==="simulated"?"done":""}">${st.cls.startsWith("verified")||st.cls==="simulated"?"✓":no}</div>
    <div class="card" data-card="${cat}"><div class="row" style="justify-content:space-between"><h2>${esc(meta.label)}${meta.required?"":` <span class="faint" style="font-weight:500">· optional</span>`}</h2><span class="badge ${st.cls}">${st.txt}</span></div>
    <p class="muted" style="margin-top:3px">${esc(meta.role)}</p>
    <div class="choices" role="radiogroup" aria-label="${esc(meta.label)} provider">${Object.entries(S.catalog.providers[cat]).map(([k,v])=>`<div class="choice" role="radio" tabindex="0" aria-checked="${d.provider===k}" data-cat="${cat}" data-prov="${k}"><b>${esc(v.label)}</b><span>${esc(v.blurb)}</span></div>`).join("")}</div>
    ${fields.map(f=>`<div class="field"><label for="f-${f.env}">${esc(f.label)}${f.set?` <span class="badge verified" style="margin-left:6px">saved${f.source==="environment"?" (from environment)":""}</span>`:""}</label>
      <div class="input-row"><input id="f-${f.env}" data-cat="${cat}" data-env="${f.env}" type="${f.kind==="secret"?"password":"text"}" autocomplete="off" spellcheck="false"
        value="${esc(d.values[f.env]??(f.kind==="text"?f.value:""))}" placeholder="${f.set&&f.kind==="secret"?esc(f.masked)+"  — leave blank to keep":esc(f.placeholder)}">
        ${f.kind==="secret"?`<button class="btn small ghost" data-show="f-${f.env}" type="button">Show</button>`:""}</div>${f.help?`<div class="help">${esc(f.help)}</div>`:""}</div>`).join("")}
    ${cat==="llm"&&prov.live?`<div class="field"><label for="llm-model">Model</label>${t&&t.models&&t.models.length?
        `<select id="llm-model" data-cat="llm">${!d.model?`<option value="">Choose a model…</option>`:""}${t.models.map(m=>`<option ${m===d.model?"selected":""}>${esc(m)}</option>`).join("")}</select>`:
        `<input type="text" id="llm-model" data-cat="llm" value="${esc(d.model)}" placeholder="Press Test connection and we'll list the models your key can use">`}
        <div class="help">Model names change often — so we fetch the real list from your account instead of guessing. <a href="${esc(prov.docs)}" target="_blank" rel="noopener">Provider docs</a></div></div>`:""}
    ${d.provider==="anthropic"||d.provider==="openai"?`<div class="callout calm" style="margin:10px 0"><b>Safe by design.</b> The AI only drafts summary text for a person to read. It can't start a run, change a setting or trigger any response.</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn" data-test="${cat}">Test connection</button><button class="btn primary" data-save="${cat}" ${dirty?"":"disabled"}>Save${dirty?"":"d"}</button>
      ${dirty?`<span class="faint" style="font-size:12.5px">You have unsaved changes.</span>`:""}</div>
    ${t?`<div class="result ${t.ok?(t.verified?"ok":"warn"):"bad"}" role="status"><b>${esc(t.message)}</b>${t.fix?`<span class="muted">${esc(t.fix)}</span>`:""}</div>`:
      (cfg.last_test?`<div class="faint" style="margin-top:10px;font-size:12.5px">Last test ${ago(cfg.last_test.tested_at)}: ${esc(cfg.last_test.message)}</div>`:"")}
  </div></div>`;
}
function bindSetup(){
  $("#save-scope")?.addEventListener("click", guard(async()=>{ await api("/api/config",{scope:{authorized_by:$("#sc-by").value,environment:$("#sc-env").value,targets:$("#sc-t").value}}); toast("Scope saved."); S.cfg=await api("/api/config"); S.doctor=(await api("/api/doctor")).checks; render(); }));
  document.querySelectorAll(".choice").forEach(el=>{ const pick=()=>{ const d=S.draft[el.dataset.cat]; d.provider=el.dataset.prov; d.values={}; delete S.tests[el.dataset.cat]; render(); }; el.addEventListener("click",pick); el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } }); });
  document.querySelectorAll("input[data-env]").forEach(i=>i.addEventListener("input",()=>{ S.draft[i.dataset.cat].values[i.dataset.env]=i.value; const sv=$(`[data-save="${i.dataset.cat}"]`); if(sv){ sv.disabled=false; sv.textContent="Save"; } }));
  $("#llm-model")?.addEventListener("change",e=>{ S.draft.llm.model=e.target.value; const sv=$('[data-save="llm"]'); sv.disabled=false; sv.textContent="Save"; });
  $("#llm-model")?.addEventListener("input",e=>{ S.draft.llm.model=e.target.value; const sv=$('[data-save="llm"]'); sv.disabled=false; sv.textContent="Save"; });
  document.querySelectorAll("[data-show]").forEach(b=>b.addEventListener("click",()=>{ const i=$("#"+b.dataset.show); i.type=i.type==="password"?"text":"password"; b.textContent=i.type==="password"?"Show":"Hide"; }));
  document.querySelectorAll("[data-test]").forEach(b=>b.addEventListener("click",guard(async()=>{ const cat=b.dataset.test, d=S.draft[cat]; b.disabled=true; b.textContent="Testing…";
    try{ const r=await api("/api/connections/test",{category:cat,provider:d.provider,values:d.values,model:d.model||null}); r.provider=d.provider; S.tests[cat]=r;
      if(cat==="llm" && r.models && r.models.length===1 && !d.model) d.model=r.models[0]; } finally{ render(); } })));
  document.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",guard(async()=>{ const cat=b.dataset.save, d=S.draft[cat];
    if(cat==="llm" && S.catalog.providers.llm[d.provider].live && !d.model){ toast("Pick a model first — press Test connection to load the list.", true); return; }
    await api("/api/connections/save",{category:cat,provider:d.provider,values:d.values,model:d.model||null});
    delete S.draft[cat]; const keep=S.tests[cat]; S.cfg=await api("/api/config"); S.doctor=(await api("/api/doctor")).checks; await refresh(); S.tests[cat]=keep; toast("Saved. Applies to the next run."); render(); })));
}

/* ---------------------------------------------------------- all findings */
function renderFindings(){
  const F=S.findF||(S.findF={status:"",stratum:"",q:""}); const all=S.findings||[];
  const name=id=>S.ov.strata.find(s=>s.id===id)?.name||id;
  const rows=all.filter(r=>(!F.status||r.status===F.status)&&(!F.stratum||r.stratum===F.stratum)&&(!F.q||r.technique_id.toLowerCase().includes(F.q.toLowerCase())||(r.ttp_id||"").includes(F.q.toLowerCase())))
    .sort((a,b)=>({gap:0,not_tested:1,caught:2}[a.status]-{gap:0,not_tested:1,caught:2}[b.status])||a.stratum.localeCompare(b.stratum));
  return `<div class="wrap"><div class="page-head"><div><h1>All findings</h1><p class="muted">Latest result for every technique tested, across all seven strata. Missed first.</p></div>
      <button class="btn" id="csv">Download CSV</button></div>
    <div class="row" style="margin-bottom:12px">
      <select id="fs" style="width:auto"><option value="">Any result</option><option value="gap" ${F.status==="gap"?"selected":""}>Missed</option><option value="not_tested" ${F.status==="not_tested"?"selected":""}>Couldn't test</option><option value="caught" ${F.status==="caught"?"selected":""}>Caught</option></select>
      <select id="fst" style="width:auto"><option value="">All strata</option>${S.ov.strata.map(s=>`<option value="${s.id}" ${F.stratum===s.id?"selected":""}>${s.n}. ${esc(s.name)}</option>`).join("")}</select>
      <input type="text" id="fq" value="${esc(F.q)}" placeholder="Search technique ID, e.g. T1003" style="width:240px"><span class="muted">${rows.length} of ${all.length}</span></div>
    <div class="card" style="padding:6px">${all.length?`<table><thead><tr><th>Technique</th><th>Stratum</th><th>Result</th><th>Mode</th><th>Tested</th><th>Fix</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="click" data-fs="${r.stratum}" data-ft="${esc(r.technique_id)}"><td><b class="mono">${esc(r.technique_id)}</b></td><td>${esc(name(r.stratum))}</td><td><span class="badge ${r.status}">${STATUS_LABEL[r.status]}</span></td>
        <td>${r.mode==="mock"?`<span class="badge simulated">simulated</span>`:"live"}</td><td class="faint">${ago(r.tested_at)}</td><td>${r.fix?`<span class="badge ${r.fix}">${r.fix.replace("_"," ")}</span>`:"—"}</td></tr>`).join("")||`<tr><td colspan="6" class="faint" style="padding:22px;text-align:center">Nothing matches.</td></tr>`}</tbody></table>`:
      `<div class="empty"><h3>No findings yet</h3><p>Run the checks from the top bar.</p></div>`}</div></div>`;
}
function bindFindings(){
  $("#fs")?.addEventListener("change",e=>{S.findF.status=e.target.value;render();}); $("#fst")?.addEventListener("change",e=>{S.findF.stratum=e.target.value;render();});
  $("#fq")?.addEventListener("input",e=>{S.findF.q=e.target.value; const pos=e.target.selectionStart; render(); const el=$("#fq"); el.focus(); el.setSelectionRange(pos,pos);});
  document.querySelectorAll("[data-ft]").forEach(tr=>tr.addEventListener("click",guard(async()=>{ const sid=tr.dataset.fs; S.stratum[sid]=await api("/api/stratum/"+sid); S.route="s:"+sid; openTechFrom(sid,tr.dataset.ft); })));
  $("#csv")?.addEventListener("click",()=>{ const rows=[["stratum","technique","result","mode","tested_at","fix"],...(S.findings||[]).map(r=>[r.stratum,r.technique_id,r.status,r.mode,r.tested_at,r.fix||""])];
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"})); a.download="xetra-findings.csv"; a.click(); S.route="findings"; });
}
function openTechFrom(sid,tid){ S.route="findings"; openTech(sid,tid); S.route="findings"; }

/* ------------------------------------------------------------- fix list */
function renderFixes(){
  const f=S.fixFilter, all=S.fixes;
  const rows=all.filter(r=>(!f.status||r.status===f.status)&&(!f.stratum||r.stratum===f.stratum));
  const cnt=s=>all.filter(r=>r.status===s).length;
  return `<div class="wrap"><div class="page-head"><div><h1>Fix list</h1><p class="muted">Every missed technique becomes an item here. XETRA proposes a fix; <b>a named person decides</b>. When a later run catches the technique, XETRA marks it verified itself.</p></div></div>
    <div class="tabs" role="tablist">${[["open","Needs a decision"],["approved","Approved — waiting for retest"],["verified","Verified fixed"],["risk_accepted","Risk accepted"],["","Everything"]].map(([k,l])=>`<button role="tab" aria-selected="${f.status===k}" data-ff="${k}">${l}${k?` <span class="faint">${cnt(k)}</span>`:` <span class="faint">${all.length}</span>`}</button>`).join("")}</div>
    <div class="row" style="margin-bottom:12px"><label class="muted">Stratum <select id="ffs" style="width:auto;margin-left:6px"><option value="">All</option>${S.ov.strata.map(s=>`<option value="${s.id}" ${f.stratum===s.id?"selected":""}>${s.n}. ${esc(s.name)}</option>`).join("")}</select></label></div>
    <div class="card" style="padding:6px 6px">${rows.length?`<table><thead><tr><th>Technique</th><th>Stratum</th><th>Proposed fix</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><b class="mono">${esc(r.technique_id)}</b><div class="faint" style="font-size:11.5px">opened ${ago(r.opened_at)}</div></td>
        <td>${esc(S.ov.strata.find(s=>s.id===r.stratum)?.name||r.stratum)}</td><td class="muted" style="font-size:13px;max-width:320px">${esc(r.recommended_action)}
          ${r.history.length?`<div class="faint" style="font-size:11.5px;margin-top:4px">${esc(r.history[r.history.length-1].by)}: ${esc(r.history[r.history.length-1].note||r.history[r.history.length-1].to)}</div>`:""}</td>
        <td><span class="badge ${r.status}">${r.status.replace("_"," ")}</span></td>
        <td style="text-align:right;white-space:nowrap">${r.status==="open"?`<button class="btn small primary" data-decide="${r.id}" data-to="approved">Approve fix</button> <button class="btn small" data-decide="${r.id}" data-to="risk_accepted">Accept risk</button>`:
          r.status==="approved"?`<button class="btn small" data-retest="${r.stratum}">Retest stratum</button>`:
          r.status==="risk_accepted"?`<button class="btn small" data-decide="${r.id}" data-to="open">Reopen</button>`:""}</td></tr>`).join("")}</tbody></table>`:
      `<div class="empty"><h3>${all.length?"Nothing in this view":"No gaps yet"}</h3><p>${all.length?"Try another tab above.":"Run the checks — any missed technique will land here for a decision."}</p></div>`}</div></div>`;
}
function decide(id,to){
  const me=store.get("xetra-name")||"";
  const need=to==="risk_accepted";
  openModal(`<h2>${to==="approved"?"Approve this fix":to==="risk_accepted"?"Accept this risk":"Reopen"}</h2>
    <p class="muted" style="margin:6px 0 12px">${to==="approved"?"You're confirming the proposed fix should be made. XETRA will check it on the next retest.":to==="risk_accepted"?"You're recording that this gap is being knowingly left open. This goes into the audit record.":"Moves the item back to “Needs a decision”."}</p>
    <div class="field"><label for="d-name">Your name</label><input type="text" id="d-name" value="${esc(me)}" placeholder="Who is making this decision?"></div>
    <div class="field"><label for="d-note">${need?"Reason (required)":"Note (optional)"}</label><textarea id="d-note" rows="3"></textarea></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="d-ok">Confirm</button></div>`);
  $("#d-ok").addEventListener("click",guard(async()=>{ const name=$("#d-name").value.trim(); store.set("xetra-name",name);
    await api("/api/fixes/"+id,{status:to,actor:name,note:$("#d-note").value}); closeLayer(); S.fixes=(await api("/api/fixes")).fixes; await refresh(); toast("Decision recorded."); render(); }));
}

/* --------------------------------------------------- activity & evidence */

  const tabs=[["runs","Runs & evidence"],["log","Activity log"]];
  const body = S.evTab==="runs" ? `<div class="card" style="padding:6px"><table><thead><tr><th>When</th><th>What</th><th>Result</th><th>Mode</th><th></th></tr></thead><tbody>
    ${S.runs.map(r=>`<tr><td>${new Date(r.started_at).toLocaleString()}<div class="faint mono" style="font-size:11px">${esc(r.run_id)}</div></td>
      <td>${esc((r.strata||[]).length===7?"All 7 strata":(r.strata||[]).map(x=>S.ov.strata.find(s=>s.id===x)?.short||x).join(", "))}<div class="faint" style="font-size:12px">${esc(r.trigger||"")}</div></td>
      <td>${r.state==="completed"?`${r.tested} tested · <b style="color:${r.gaps?"var(--gap)":"var(--caught)"}">${r.gaps} missed</b>${r.not_tested?` · ${r.not_tested} unknown`:""}`:`<span class="badge ${r.state==="failed"?"gap":"not_tested"}">${esc(r.state)}</span>`}</td>
      <td><span class="badge ${r.mode==="mock"?"simulated":"verified"}">${r.mode==="mock"?"simulated":"live"}</span>${r.partial?` <span class="badge untested">partial</span>`:""}</td>
      <td style="text-align:right">${r.file?`<a class="btn small" href="/evidence/${encodeURIComponent(r.file)}" download>Download JSON</a>`:""}</td></tr>`).join("")||`<tr><td colspan="5"><div class="empty"><h3>No runs yet</h3><p>Start one from the top bar.</p></div></td></tr>`}</tbody></table></div>
    <div class="dropzone" id="drop" tabindex="0" role="button" style="margin-top:14px">Open an evidence file from disk — drop a <span class="mono">xetra-attest-*.json</span> here or click to choose.<div class="faint" style="font-size:12px;margin-top:4px">Read entirely in your browser. Nothing is uploaded. Works with files from older versions too.</div><input type="file" id="evfile" accept=".json" hidden></div>
    <div class="row" style="margin-top:14px"><a class="btn" href="/api/posture/export" download>Download full posture (all 7 strata, latest result per technique)</a></div>
    <p class="faint" style="margin-top:8px;max-width:70ch">Evidence from simulated runs carries <span class="mono">mock_mode: true</span> and is for testing only. Evidence from a run of some strata is marked <span class="mono">partial: true</span>; use the full-posture download for a complete picture.</p>`
    : `<div class="row" style="margin-bottom:10px"><select id="evf" style="width:auto"><option value="">Everything</option><option value="run">Runs</option><option value="fix">Fix decisions</option><option value="control">Controls (pause, schedule, playbooks)</option><option value="config">Settings</option><option value="connection">Connection tests</option></select>
      <a class="btn small" href="/api/events.jsonl" download>Download log</a></div>
    <div class="card" style="padding:6px"><table><tbody>${S.events.filter(e=>!S.evFilter||e.kind.startsWith(S.evFilter)).map(e=>`<tr><td style="width:150px;white-space:nowrap" class="faint">${new Date(e.ts).toLocaleString()}</td>
      <td style="width:26px"><span class="sdot ${e.level==="error"?"gaps":e.level==="warn"?"not_tested":"healthy"}" style="display:inline-block"></span></td><td>${esc(e.message)}<div class="faint mono" style="font-size:11px">${esc(e.kind)}</div></td></tr>`).join("")||`<tr><td><div class="empty">Nothing logged yet.</div></td></tr>`}</tbody></table></div>`;
  return `<div class="wrap"><div class="page-head"><div><h1>Activity &amp; evidence</h1><p class="muted">Everything XETRA did and everything a person told it to do — nothing happens off the record.</p></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${S.evTab===k}" data-et="${k}">${l}</button>`).join("")}</div>${body}</div>`;
}

function viewEvidenceFile(file){
  const rd=new FileReader(); rd.onload=()=>{ let d; try{ d=JSON.parse(rd.result); }catch(e){ toast("That file isn't valid JSON.",true); return; }
    if(d.program!=="XETRA"||!Array.isArray(d.findings)){ toast("That doesn't look like a XETRA evidence package.",true); return; }
    const st=f=>f.status||(f.gap?"gap":"caught"); const sm=d.summary||{};
    openDrawer(`<div class="row" style="justify-content:space-between"><div><div class="faint mono">${esc(file.name)}</div><h1>Evidence package</h1></div><button class="btn small" data-close>Close</button></div>
      <div style="margin:10px 0"><span class="badge ${d.mock_mode?"simulated":"verified"}">${d.mock_mode?"simulated — not audit evidence":"live"}</span> ${d.partial?`<span class="badge untested">partial: ${(d.strata_covered||[]).join(", ")}</span>`:""}</div>
      <dl class="kv"><dt>Cycle</dt><dd>${esc(d.cycle_label)}</dd><dt>Generated</dt><dd>${new Date(d.generated_at).toLocaleString()}</dd><dt>Tested</dt><dd>${sm.techniques_tested??d.findings.length}</dd><dt>Missed</dt><dd>${sm.gaps_found??d.findings.filter(f=>st(f)==="gap").length}</dd>
      <dt>Tools</dt><dd class="mono">${esc(Object.entries(d.adapter_modes||{}).map(([k,v])=>k+"="+v).join("  "))}</dd></dl>
      ${d.analyst_summary?`<div class="callout calm"><b>AI-drafted summary (needs human review)</b><p style="margin-top:4px">${esc(d.analyst_summary.text)}</p></div>`:""}
      <h3 style="margin-top:14px">Findings</h3><table><tbody>${d.findings.map(f=>`<tr><td class="mono">${esc(f.technique_id)}</td><td>${esc(f.stratum)}</td><td><span class="badge ${st(f)}">${STATUS_LABEL[st(f)]}</span></td></tr>`).join("")}</tbody></table>`); };
  rd.readAsText(file);
}

/* -------------------------------------------------------------- controls */
function renderControls(){
  const o=S.ov, c=S.cfg; if(!c) return `<div class="wrap"><div class="empty">Loading…</div></div>`;
  const sch=o.schedule;
  const soarLive=o.adapter_modes.soar!=="mock";
  return `<div class="wrap"><div class="page-head"><div><h1>Controls</h1><p class="muted">Everything that decides when XETRA acts. Nothing here is hidden in a file.</p></div></div>
    <div class="card">
      <div class="switch"><div class="t"><h3>Pause everything</h3><p>Blocks all runs — manual and scheduled — until you resume. Use this in an incident or change freeze. Also in the top bar.</p></div>
        <button class="tog" role="switch" aria-checked="${o.paused}" aria-label="Pause everything" data-tog="pause"></button></div>
      <div class="switch"><div class="t"><h3>Run automatically</h3><p>Re-checks all 7 strata on a timer.${sch.enabled&&sch.next_run_at?` Next run ${until(sch.next_run_at)}.`:""}</p>
          <div class="row" style="margin-top:8px"><label>Every <input type="number" id="sch-min" min="5" max="10080" value="${sch.every_minutes}" style="width:90px;display:inline-block;margin:0 6px"> minutes</label><button class="btn small" id="sch-save">Update</button></div></div>
        <button class="tog" role="switch" aria-checked="${sch.enabled}" aria-label="Run automatically" data-tog="schedule"></button></div>
      <div class="switch"><div class="t"><h3>Allow real containment playbooks</h3>
          <p>${soarLive?"When a technique is missed, XETRA will run your live response playbook (isolate, revoke, rotate…). <b>These act on real systems.</b> Leave off until you've reviewed what each playbook does.":"Your response tool is simulated, so nothing real can happen. This only matters once you connect a live SOAR."}</p></div>
        <button class="tog risky" role="switch" aria-checked="${c.respond.allow_live_playbooks}" aria-label="Allow real containment playbooks" data-tog="playbooks"></button></div>
      <div class="switch"><div class="t"><h3>Include the extended technique library</h3><p>On: the full ATT&amp;CK coverage (${o.totals.defined} techniques). Off: only the core ARTEX kill chain. Takes effect on the next run.</p></div>
        <button class="tog" role="switch" aria-checked="${c.include_extended_attack_library}" aria-label="Include extended library" data-tog="extended"></button></div>
    </div>
    <div class="card"><h3>When data counts as stale</h3><p class="muted" style="margin-top:3px">${o.schedule.enabled?`Three missed runs (${o.stale.threshold_minutes} min) while the schedule is on.`:`No run for ${Math.round(o.stale.threshold_minutes/60)} hours. Turn the schedule on to get a tighter limit, or set <span class="mono">stale_after_minutes</span> in config.yaml.`} A red banner appears on every stratum screen when it happens.</p></div>
    <div class="card"><h3>Where things live</h3><dl class="kv"><dt>Settings file</dt><dd class="mono">${esc(c.config_path)}</dd><dt>Memory &amp; audit log</dt><dd class="mono">${esc(c.state_dir)}</dd><dt>Credentials</dt><dd class="mono">${esc(c.state_dir)}/secrets.env <span class="faint">(private; never shown here)</span></dd></dl></div></div>`;
}
function bindControls(){
  document.querySelectorAll("[data-tog]").forEach(b=>b.addEventListener("click",guard(async()=>{ const on=b.getAttribute("aria-checked")!=="true"; const k=b.dataset.tog;
    if(k==="pause") await api("/api/pause",{paused:on});
    else if(k==="schedule") await api("/api/schedule",{enabled:on,every_minutes:+$("#sch-min").value||60});
    else if(k==="playbooks"){ if(on && !confirm("Allow XETRA to trigger REAL containment playbooks (isolate hosts, revoke keys, rotate credentials) whenever a technique is missed?")) return; await api("/api/config",{allow_live_playbooks:on}); }
    else if(k==="extended") await api("/api/config",{include_extended_attack_library:on});
    S.cfg=await api("/api/config"); await refresh(); toast("Updated."); render(); })));
  $("#sch-save")?.addEventListener("click",guard(async()=>{ await api("/api/schedule",{enabled:S.ov.schedule.enabled,every_minutes:+$("#sch-min").value}); await refresh(); toast("Schedule updated."); render(); }));
}

/* ----------------------------------------------------------------- render */
function render(){
  if(!S.ov) return;
  renderBar(); renderRail();
  const r=S.route, m=$("#main"); let html;
  if(r==="overview") html=renderOverview(); else if(r.startsWith("s:")) html=renderStratum(r.slice(2));
  else if(r==="setup") html=renderSetup(); else if(r==="fixes") html=renderFixes(); else if(r==="findings") html=renderFindings(); else if(r==="activity") html=renderActivity(); else if(r==="controls") html=renderControls();
  const y=m.scrollTop; m.innerHTML=(r==='overview'||r.startsWith('s:')||r==='findings'?staleBanner():'')+html; m.scrollTop=y;
  document.title = "XETRA" + (S.ov.totals.gaps?` · ${S.ov.totals.gaps} missed`:"");
  m.querySelectorAll("[data-go]").forEach(a=>a.addEventListener("click",e=>{ e.preventDefault(); go(a.dataset.go); }));
  m.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>go("s:"+b.dataset.s)));
  m.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",guard(async()=>{ const a=b.dataset.act; if(a==="run_all") await startRun([]); else if(a==="goto") go(b.dataset.t); else if(a==="resume"){ await api("/api/pause",{paused:false}); await refresh(); } })));
  m.querySelectorAll("[data-retest]").forEach(b=>b.addEventListener("click",guard(()=>startRun([b.dataset.retest]))));
  m.querySelectorAll("[data-sf]").forEach(b=>b.addEventListener("click",()=>{ S.stFilter=b.dataset.sf; render(); }));
  m.querySelectorAll("[data-tech]").forEach(tr=>tr.addEventListener("click",()=>openTech(S.route.slice(2),tr.dataset.tech)));
  m.querySelectorAll("[data-ff]").forEach(b=>b.addEventListener("click",()=>{ S.fixFilter.status=b.dataset.ff; render(); }));
  $("#ffs")?.addEventListener("change",e=>{ S.fixFilter.stratum=e.target.value; render(); });
  m.querySelectorAll("[data-decide]").forEach(b=>b.addEventListener("click",()=>decide(b.dataset.decide,b.dataset.to)));
  const dz=$("#drop"); if(dz){ const fi=$("#evfile"); dz.addEventListener("click",()=>fi.click()); fi.addEventListener("change",()=>fi.files[0]&&viewEvidenceFile(fi.files[0]));
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");}); dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over"); if(e.dataTransfer.files[0]) viewEvidenceFile(e.dataTransfer.files[0]);}); }
  m.querySelectorAll("[data-et]").forEach(b=>b.addEventListener("click",()=>{ S.evTab=b.dataset.et; render(); }));
  $("#evf")?.addEventListener("change",e=>{ S.evFilter=e.target.value; render(); }); if($("#evf")) $("#evf").value=S.evFilter;
  if(r==="findings") bindFindings(); if(r==="setup") bindSetup(); if(r==="controls") bindControls();
  if(r==="overview"){ renderLive(); if(!S.bandsHydrated || !Object.keys(S.stratum).length){ S.bandsHydrated=true; hydrateBands(); } else hydrateBands(); }
}

/* ------------------------------------------------------------------ boot */
(async function boot(){
  const saved=store.get("xetra-theme"); document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  try{ S.catalog=await api("/api/catalog"); await refresh(); const h=location.hash.slice(1); if(h) { S.route=h; await loadRoute(); } render();
    setInterval(async()=>{ if(!S.poll && !document.hidden){ try{ const prev=JSON.stringify(S.ov.strata.map(s=>[s.tested,s.gaps,s.not_tested])+S.ov.paused); S.ov=await api("/api/overview"); renderBar(); renderRail();
      const j=S.ov.job; if(j && ["running","stopping"].includes(j.state)) startPolling(); } catch(e){} } }, 8000);
  }catch(e){ $("#main").innerHTML=`<div class="wrap"><div class="card"><h2>Can't reach XETRA</h2><p class="muted" style="margin:6px 0">${esc(e.message)}</p></div></div>`; }
})();
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h && h!==S.route) go(h); });
</script>
</body>
</html>
