# XETRA configuration. You normally never edit this by hand —
# `xetra start` creates it and the dashboard's Setup tab changes it.
# Credentials are NOT stored here; they live in .xetra/secrets.env (chmod 600).

state_dir: .xetra                  # runtime memory: results, fix list, audit trail, credentials
evidence_output_dir: evidence_output
include_extended_attack_library: true

bas:  {provider: mock, options: {}}   # mock | attackiq | pentera | safebreach | cymulate
siem: {provider: mock, options: {}}   # mock | splunk | sentinel | elastic
soar: {provider: mock, options: {}}   # mock | tines | xsoar
edr:  {provider: mock, options: {}}   # mock | crowdstrike | defender
llm:  {provider: none, options: {}}   # none | mock | anthropic | openai   (optional; text only, never acts)

respond:
  allow_live_playbooks: false         # must stay false until a human enables it (dashboard → Controls)

scope:                                # must reflect your signed Rules of Engagement before going live
  authorized_by: ""
  environment: staging                # staging | production
  targets: []
  attackiq_assessment_map: {}
