# XETRA Extended TTP Library — full MITRE ATT&CK Enterprise tactic
# coverage, organized by stratum. This extends (does not replace)
# artex_ttps.yaml, which stays focused on the specific FBI-documented
# ARTEX kill chain. Load both via config to validate against ARTEX
# specifically *and* the broader technique landscape BAS platforms
# already cover.
#
# As with artex_ttps.yaml: every entry is a public ATT&CK technique ID,
# the same identifier your licensed BAS platform already uses to select
# its own pre-built safe emulation module. No technique-level
# implementation detail is or will be added here.

- id: ext-recon-02
  stratum: infra_network
  attack_ids: ["T1592", "T1589", "T1590", "T1591", "T1596", "T1597", "T1598"]
  description: "Gather victim host/identity/network/org info; search open technical/closed databases; phishing for information."
  expected_control: "OSINT-exposure monitoring; brand/phishing-domain monitoring"

- id: ext-resourcedev-01
  stratum: infra_network
  attack_ids: ["T1583", "T1584", "T1585", "T1586", "T1587", "T1588"]
  description: "Acquire infrastructure, compromise accounts/infra, establish accounts, develop/obtain capabilities — adversary-side prep, validated via threat-intel monitoring of look-alike domains/infra."
  expected_control: "Threat-intel feed monitoring for look-alike domains, typosquats, leaked credentials"

- id: ext-initialaccess-02
  stratum: service
  attack_ids: ["T1566.001", "T1566.002", "T1566.003", "T1091", "T1200"]
  description: "Phishing (attachment/link/service), replication via removable media, hardware additions."
  expected_control: "Email security gateway detonation; removable-media control policy; USB/HID device control"

- id: ext-execution-01
  stratum: system
  attack_ids: ["T1059.003", "T1059.004", "T1059.005", "T1059.006", "T1053", "T1203", "T1204"]
  description: "Command interpreter abuse (cmd/bash/VBS/Python), scheduled task/job abuse, exploitation for client execution, user execution."
  expected_control: "Script-block logging + behavioral EDR detection on interpreter abuse; scheduled-task creation alerting"

- id: ext-defenseevasion-01
  stratum: system
  attack_ids: ["T1070", "T1562", "T1027", "T1140", "T1222", "T1484"]
  description: "Indicator removal, impair defenses (disable EDR/logging), obfuscated files, deobfuscate/decode, file/directory permission mod, domain/group policy modification."
  expected_control: "Tamper-protection alerting on EDR/logging service stop attempts; GPO change auditing"

- id: ext-credaccess-01
  stratum: system
  attack_ids: ["T1110", "T1003", "T1056", "T1111", "T1621", "T1649"]
  description: "Brute force, OS credential dumping (LSASS/SAM/NTDS), input capture/keylogging, MFA interception, MFA request generation/fatigue, steal/forge authentication certificates."
  expected_control: "LSASS-access alerting (credential-guard/EDR); MFA-fatigue/push-spam detection; brute-force lockout + alerting"

- id: ext-discovery-02
  stratum: system
  attack_ids: ["T1082", "T1016", "T1049", "T1007", "T1124", "T1497"]
  description: "System/network-configuration discovery, network-connections discovery, system-service discovery, system-time discovery, virtualization/sandbox evasion checks."
  expected_control: "Baseline discovery-command volume per host; sandbox-evasion-technique detection in EDR"

- id: ext-lateral-02
  stratum: system
  attack_ids: ["T1210", "T1534", "T1570", "T1563"]
  description: "Exploitation of remote services, internal spear-phishing, lateral tool transfer, remote-service session hijacking."
  expected_control: "East-west segmentation alerting; internal-phishing detection; file-transfer-between-hosts anomaly"

- id: ext-collection-02
  stratum: service
  attack_ids: ["T1056.001", "T1113", "T1115", "T1119", "T1125"]
  description: "Keylogging, screen capture, clipboard data, automated collection, video capture."
  expected_control: "EDR behavioral detection on screen/clipboard/input-capture API hooking"

- id: ext-c2-02
  stratum: protocol
  attack_ids: ["T1095", "T1573", "T1008", "T1102.002"]
  description: "Non-application-layer protocol C2, encrypted channel, fallback channels, bidirectional web-service C2 (dead-drop resolvers)."
  expected_control: "Non-standard-port/protocol egress alerting; JA3/JA4 TLS-fingerprint anomaly detection"

- id: ext-exfil-01
  stratum: service
  attack_ids: ["T1041", "T1048", "T1029", "T1030", "T1537"]
  description: "Exfil over C2 channel, exfil over alternative protocol, scheduled transfer, data-transfer-size limits (evasion), transfer to cloud account."
  expected_control: "DLP on outbound volume; scheduled-large-transfer anomaly; cross-cloud-account transfer alerting"

- id: ext-impact-01
  stratum: system
  attack_ids: ["T1486", "T1490", "T1489", "T1491", "T1485"]
  description: "Data encrypted for impact (ransomware), inhibit system recovery (delete shadow copies/backups), service stop, defacement, data destruction."
  expected_control: "Mass-file-rename/encryption-rate alerting; shadow-copy/backup-deletion alerting; canary-file tripwires"

- id: ext-algorithm-01
  stratum: algorithm
  attack_ids: ["T1600", "T1600.001", "T1600.002"]
  description: "Weaken encryption (reduce key space, disable crypto hardware) — algorithm-layer tampering."
  expected_control: "Crypto-config drift alerting; HSM/crypto-hardware tamper detection"

- id: ext-software-01
  stratum: software
  attack_ids: ["T1195.001", "T1195.002", "T1195.003", "T1554"]
  description: "Supply-chain compromise (dependencies/build tools, software supply chain, hardware supply chain), compromise of client software binary."
  expected_control: "SBOM drift alerting; build-provenance (SLSA/Sigstore) verification failure alerting"

- id: ext-hardware-01
  stratum: hardware
  attack_ids: ["T1542.001", "T1542.003", "T1200"]
  description: "Pre-OS boot (system firmware, bootkit), hardware additions."
  expected_control: "Measured-boot/firmware-attestation failure alerting; unauthorized-device-connection alerting"

